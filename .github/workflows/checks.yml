# Every check, on every change (stage 6, section 23): nothing merges unless all of it passes.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-trixie@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres

  app:
    name: App
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 1
      EXPO_OFFLINE: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The app's theme and icons are exactly what the design's own source makes (D95).
      - run: python3 tools/theme/generate.py --check
      # The app compiles for both phones.
      - run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/app-bundles"
        working-directory: app
      # The components behave as they say: signing by holding, switches, filters, the focus ring.
      - run: npm run build -w tools/gallery
      - run: npx playwright install --with-deps chromium
        working-directory: tools/gallery
      - run: node --test tools/gallery/interact.ts

  server-image:
    name: Server image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-trixie@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f server/Dockerfile -t agent-v-server .
      - run: server/scripts/smoke-image.sh agent-v-server postgres://postgres@127.0.0.1:5432/postgres
