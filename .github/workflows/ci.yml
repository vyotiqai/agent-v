name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @agent-v/shared test
      - run: pnpm --filter @agent-v/net test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-v/browser exec playwright-core install --with-deps chromium
      - run: pnpm --filter @agent-v/browser test

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentv
          POSTGRES_PASSWORD: agentv
          POSTGRES_DB: agentv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentv" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://agentv:agentv@127.0.0.1:5432/agentv_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The cloud-browser tests drive a real Chromium.
      - run: pnpm --filter @agent-v/browser exec playwright-core install --with-deps chromium
      - run: pnpm --filter @agent-v/server test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [web, ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export ${{ matrix.platform }} bundle
        working-directory: apps/app
        run: pnpm exec expo export --platform ${{ matrix.platform }} --output-dir dist/${{ matrix.platform }}
