<!doctype html>
<html>
<head><meta charset="utf-8"><title>Agent V — cover</title>
<style>
  html, body { margin: 0; }
  body { width: 960px; height: 300px; position: relative; overflow: hidden; background: var(--ground); font-family: var(--font-sans); }
  .slab { fill: var(--bar); }
  .glow { fill: var(--glow); }
  .chip { fill: var(--glass); }
  .blue { fill: var(--blue); }
  .deep { fill: var(--blue-deep); }
  .surface { fill: var(--surface); }
  .line { fill: var(--line); }
  .ink { fill: var(--ink); }
  .red { fill: var(--red-on-night); }
  .green { fill: var(--green); }
  .name { position: absolute; left: 56px; bottom: 104px; margin: 0; font-size: 96px; line-height: .95; font-weight: 500; letter-spacing: -0.045em; color: var(--ink); }
  .tag { position: absolute; left: 60px; bottom: 44px; width: 420px; margin: 0; font-size: 14px; line-height: 1.4; color: var(--ink-muted); }
</style></head>
<body>

  <!-- scales: space-8 between blocks, space-12 insets, space-24 text inset; radius-sheet, radius-block, radius-pill -->

  <rect class="line" x="866" y="238" width="22" height="4" rx="2"/>
</svg>
<p class="name">Agent V</p>
<p class="tag">Hand it off. It plans, works around the clock, and brings you only what needs you.</p>
</body>
</html>
