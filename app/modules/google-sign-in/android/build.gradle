plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// Part of the app, never published as a package of its own, so no Maven publication (which would
// need a version of its own).
expoModule {
  canBePublished false
}

android {
  namespace "agentv.modules.googlesignin"
}

dependencies {
  // Android's own sign-in sheet (Credential Manager), and the Google credential it returns.
  implementation "androidx.credentials:credentials:1.5.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
