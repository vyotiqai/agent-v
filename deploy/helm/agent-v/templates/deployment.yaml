{{- $fullname := include "agent-v.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels: {{- include "agent-v.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "agent-v.selector" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels: {{- include "agent-v.selector" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/env: {{ toJson .Values.env | sha256sum | trunc 16 }}
        {{- if not .Values.existingSecret }}
        checksum/secrets: {{ toJson .Values.secrets | sha256sum | trunc 16 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Replies stream for up to a few minutes; give them time to finish on rollout.
      terminationGracePeriodSeconds: 60
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - secretRef:
                name: {{ include "agent-v.secretName" . }}
          env:
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: APP_URL
              value: {{ .Values.publicUrl | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ concat (list .Values.publicUrl "tauri://localhost" "http://tauri.localhost") .Values.extraAllowedOrigins | join "," | quote }}
            - name: TRUST_PROXY
              value: "true"
            {{- if or (gt (int .Values.replicaCount) 1) .Values.autoscaling.enabled }}
            # Several replicas share rate limits through Postgres.
            - name: RATE_LIMIT_STORE
              value: postgres
            {{- end }}
            {{- if .Values.browser.enabled }}
            - name: BROWSER_URL
              value: "http://{{ $fullname }}-browser:8790"
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 60
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: files
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-files" $fullname) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
