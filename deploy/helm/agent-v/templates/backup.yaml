{{- if .Values.backup.enabled }}
{{- $fullname := include "agent-v.fullname" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-backup
  labels: {{- include "agent-v.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              command: [sh, /scripts/backup.sh]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "agent-v.secretName" . }}
                      key: DATABASE_URL
                - { name: BACKUP_KEEP_DAYS, value: {{ .Values.backup.keepDays | quote }} }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: backups, mountPath: /backups }
                - { name: tmp, mountPath: /tmp }
                {{- if .Values.persistence.enabled }}
                - { name: files, mountPath: /data, readOnly: true }
                {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ $fullname }}-backup
            - name: backups
              persistentVolumeClaim:
                claimName: {{ $fullname }}-backups
            - name: tmp
              emptyDir: {}
            {{- if .Values.persistence.enabled }}
            - name: files
              persistentVolumeClaim:
                claimName: {{ .Values.persistence.existingClaim | default (printf "%s-files" $fullname) }}
                readOnly: true
            {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-backup
  labels: {{- include "agent-v.labels" . | nindent 4 }}
data:
  backup.sh: |
{{ .Files.Get "files/backup.sh" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-backups
  labels: {{- include "agent-v.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backup.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
{{- end }}
