{{- if not .Values.existingSecret }}
{{- $required := list "BETTER_AUTH_SECRET" "BROWSER_TOKEN" }}
{{- range $required }}
{{- if not (index $.Values.secrets .) }}
{{- fail (printf "secrets.%s is required (or set existingSecret)" .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-v.secretName" . }}
  labels: {{- include "agent-v.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if and $value (ne $key "DATABASE_URL") }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ include "agent-v.databaseUrl" . | quote }}
  POSTGRES_PASSWORD: {{ required "postgresql.password is required" .Values.postgresql.password | quote }}
  {{- else }}
  DATABASE_URL: {{ required "secrets.DATABASE_URL is required (or enable postgresql)" .Values.secrets.DATABASE_URL | quote }}
  {{- end }}
{{- end }}
