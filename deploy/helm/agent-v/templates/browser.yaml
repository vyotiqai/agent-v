{{- if .Values.browser.enabled }}
{{- $fullname := include "agent-v.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-browser
  labels: {{- include "agent-v.labels" . | nindent 4 }}
    app.kubernetes.io/component: browser
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "agent-v.selector" . | nindent 6 }}
      app.kubernetes.io/component: browser
  template:
    metadata:
      labels: {{- include "agent-v.selector" . | nindent 8 }}
        app.kubernetes.io/component: browser
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: browser
          image: "{{ .Values.browser.image.repository }}:{{ .Values.browser.image.tag | default .Chart.AppVersion }}"
          ports:
            - name: http
              containerPort: 8790
          env:
            - name: BROWSER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-v.secretName" . }}
                  key: BROWSER_TOKEN
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.browser.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: profiles, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: profiles
          persistentVolumeClaim:
            claimName: {{ $fullname }}-browser
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-browser
  labels: {{- include "agent-v.labels" . | nindent 4 }}
spec:
  selector: {{- include "agent-v.selector" . | nindent 4 }}
    app.kubernetes.io/component: browser
  ports:
    - name: http
      port: 8790
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-browser
  labels: {{- include "agent-v.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.browser.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.browser.persistence.size }}
---
# Only the API may reach the browser worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-browser
  labels: {{- include "agent-v.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "agent-v.selector" . | nindent 6 }}
      app.kubernetes.io/component: browser
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "agent-v.selector" . | nindent 14 }}
              app.kubernetes.io/component: server
      ports:
        - port: 8790
{{- end }}
