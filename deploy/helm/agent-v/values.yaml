# Agent V on Kubernetes. Minimum: set publicUrl, the secrets (or existingSecret) and a
# Postgres with pgvector (external, or postgresql.enabled for a trial).

image:
  repository: ghcr.io/your-org/agent-v
  tag: ""  # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Where people reach Agent V, e.g. https://agent.example.com
publicUrl: https://agent.example.com
# Extra origins allowed to call the API (the desktop app's are included by default).
extraAllowedOrigins: []

replicaCount: 2

# Secrets: either name an existing Secret with these keys, or fill them in here.
#   BETTER_AUTH_SECRET, TOKEN_ENCRYPTION_KEY, BROWSER_TOKEN, DATABASE_URL, and any provider
#   keys (OPENAI_API_KEY, ANTHROPIC_API_KEY, SMTP_URL, STRIPE_SECRET_KEY, …).
existingSecret: ""
secrets:
  BETTER_AUTH_SECRET: ""
  TOKEN_ENCRYPTION_KEY: ""
  BROWSER_TOKEN: ""
  DATABASE_URL: ""

# Plain settings passed as environment variables (see .env.example for all of them).
env:
  DEFAULT_MODEL: demo/agent-v
  LOG_FORMAT: json
  # PLANS: default
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318

resources:
  requests: { cpu: 250m, memory: 384Mi }
  limits: { memory: 1Gi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Uploaded files. With more than one replica the volume must be ReadWriteMany (NFS, EFS,
# Filestore, CephFS, …) so every replica sees every file.
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteMany
  size: 20Gi
  existingClaim: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
    # Replies stream over SSE; with ingress-nginx turn off buffering:
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  tls:
    enabled: true
    secretName: agent-v-tls

# The cloud browser worker (one replica: sessions live in its memory and on its volume).
browser:
  enabled: true
  image:
    repository: ghcr.io/your-org/agent-v-browser
    tag: ""
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 3Gi }
  persistence:
    size: 10Gi
    storageClass: ""

# A single Postgres (pgvector) for trials. Use a managed Postgres with pgvector in production
# and put its URL in DATABASE_URL.
postgresql:
  enabled: false
  image: pgvector/pgvector:pg18
  password: ""
  storage: 20Gi
  storageClass: ""

# Nightly pg_dump into a volume (copy it off the cluster, or use your provider's snapshots).
backup:
  enabled: true
  schedule: "17 3 * * *"
  keepDays: 14
  image: pgvector/pgvector:pg18
  storage: 50Gi
  storageClass: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}
