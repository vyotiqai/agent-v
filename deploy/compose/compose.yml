# Agent V in production on one machine: HTTPS, the API and web app, the cloud browser,
# Postgres with pgvector, and nightly backups.
#   cp .env.example .env    # fill it in
#   docker compose up -d --build
# Add tracing with:  docker compose --profile observability up -d
name: agent-v

x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    <<: *hardened
    image: caddy:2
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server: { condition: service_healthy }

  server:
    <<: *hardened
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${AGENT_V_IMAGE:-agent-v:latest}
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
      APP_URL: https://${DOMAIN}
      ALLOWED_ORIGINS: https://${DOMAIN},tauri://localhost,http://tauri.localhost
      DATABASE_URL: postgresql://agentv:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/agentv
      BROWSER_URL: http://browser:8790
      TRUST_PROXY: "true"
      LOG_FORMAT: json
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    volumes:
      - files:/data
    depends_on:
      postgres: { condition: service_healthy }
      browser: { condition: service_healthy }

  browser:
    <<: *hardened
    build:
      context: ../..
      dockerfile: apps/browser/Dockerfile
    image: ${AGENT_V_BROWSER_IMAGE:-agent-v-browser:latest}
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:?Set BROWSER_TOKEN}
    volumes:
      - browser-profiles:/data
    # Chromium runs without its own sandbox inside the container, so the container is locked down.
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    shm_size: 1gb
    mem_limit: 3g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 3

  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: agentv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agentv
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentv"]
      interval: 5s
      retries: 10

  # A backup every BACKUP_INTERVAL_HOURS into the backups volume (copy it off the machine too).
  backup:
    restart: unless-stopped
    image: pgvector/pgvector:pg18
    entrypoint: ["sh", "/scripts/backup.sh", "--every", "${BACKUP_INTERVAL_HOURS:-24}"]
    environment:
      DATABASE_URL: postgresql://agentv:${POSTGRES_PASSWORD}@postgres:5432/agentv
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ../backup:/scripts:ro
      - backups:/backups
      - files:/data:ro
    depends_on:
      postgres: { condition: service_healthy }

  # Traces and metrics: set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 in .env.
  otel-collector:
    <<: *hardened
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]

  jaeger:
    <<: *hardened
    profiles: [observability]
    image: jaegertracing/jaeger:2.10.0
    # The trace UI stays on this machine: ssh -L 16686:localhost:16686 your-server
    ports: ["127.0.0.1:16686:16686"]

volumes:
  pgdata:
  files:
  browser-profiles:
  backups:
  caddy-data:
  caddy-config:
