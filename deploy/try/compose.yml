# Try Agent V on your own computer with only Docker installed:
#   docker compose -f deploy/try/compose.yml up --build
# then open http://localhost:8787. The first build takes a few minutes.
#
# Everything works offline with the built-in demo model, a demo mailbox and sample tools.
# For real AI, pass a key when you start it, e.g.:
#   ANTHROPIC_API_KEY=sk-ant-… DEFAULT_MODEL=anthropic/claude-sonnet-5 docker compose -f deploy/try/compose.yml up --build
# This is for trying it out on your machine only: the secrets below are not secret.
name: agent-v-try

services:
  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: agent-v:latest
    ports: ["127.0.0.1:8787:8787"]
    environment:
      PUBLIC_URL: http://localhost:8787
      ALLOWED_ORIGINS: http://localhost:8787,http://127.0.0.1:8787,tauri://localhost,http://tauri.localhost
      DATABASE_URL: postgresql://agentv:agentv@postgres:5432/agentv
      BETTER_AUTH_SECRET: try-agent-v-locally-not-a-real-secret-000
      BROWSER_URL: http://browser:8790
      BROWSER_TOKEN: try-agent-v-locally-browser-token-00000000
      # No sign-in: the app opens straight into your account. Set SINGLE_USER=false to get
      # sign-up and sign-in (and teams, invitations, admin) back.
      SINGLE_USER: ${SINGLE_USER:-true}
      # Offline demo features.
      DEMO_MODEL: "true"
      DEMO_WORKSPACE: "true"
      MCP_DEMO: "true"
      # Plans and usage meters. The built-in account (and anyone signing up with the other
      # email) also gets the Admin screen.
      PLANS: default
      ADMIN_EMAILS: ${ADMIN_EMAILS:-me@agent-v.local,admin@example.com}
      # Real models (optional).
      DEFAULT_MODEL: ${DEFAULT_MODEL:-demo/agent-v}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
    volumes:
      - files:/data
    depends_on:
      postgres: { condition: service_healthy }
      browser: { condition: service_started }

  browser:
    build:
      context: ../..
      dockerfile: apps/browser/Dockerfile
    image: agent-v-browser:latest
    environment:
      BROWSER_TOKEN: try-agent-v-locally-browser-token-00000000
    volumes:
      - browser-profiles:/data
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: agentv
      POSTGRES_PASSWORD: agentv
      POSTGRES_DB: agentv
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentv"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
  files:
  browser-profiles:
